<html>
    <body>
        <h2>JavaScript Objects data structure and arrays</h2>
        <p id="name"></p>
        <p id="age"></p>
        <p id="grade"></p>
        <p id="hobby"></p>
        <p id="favourite sport"></p>
        <script>
             var student = {
                name: "Tina",
                age: "10",
                grade: "5th",
                hobby: "Drawing",
                favouritesport: "Soccer"
            }
            document.getElementById("name").innerHTML = student.name;
            document.getElementById("age").innerHTML = student.age;
            document.getElementById("grade").innerHTML = student.grade;
            document.getElementById("hobby").innerHTML = student.hobby;
            document.getElementById("favourite sport").innerHTML = student.favouritesport;

            var color = ["Red", "Blue", "Green", "Yellow"];
            document.getElementById("color").innerHTML = color;

            document.write("student name is" + student.name + "<br>" + "student favourite sport is" + student.favouritesport);
            document.getElementById("name").innerHTML = "student name is" + student.name;
            document.getElementById("favourite sport").innerHTML = "student favourite sport is" + student.favouritesport;

            document.write("<br>Before poping the colors are:" + color.join("^"));
            document.getElementById("color").innerHTML = "Before poping the colors are:" + color.join(" ^ ");

            document.write("<br>My favourite color is:" + color[3]);
            document.getElementById("color").innerHTML = "My favourite color is:" + color[3];

            color.pop();
            document.write("<br>After poping the colors are:" + color.join("*"));
            document.getElementById("color").innerHTML = "After poping the colors are:" + color.join(" * ");

            </script>
    </body>
</html>
