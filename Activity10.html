<html>
    <head>
        <title>My restaurant menu card</title>
        <style>
            body {
                background-color: lightblue;
                color: green;
                font-family: arial, sans-serif;
            }
            .restaurant-name {
                font-size: 60px;
                font-weight: bold;
                color: orange;
                text-shadow: 3px 3px yellow;
            }
            .tagline {
                font-style: itallic;
                color: lightgreen;
                text-transform: capitalize;            
            }
            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color:coral;
            }
            .power {
                font-weight: bold;
                color: lightgreen;
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
         <center> <h1 class="restaurant-name"> The crazy kitchen</h1></center>
          <p class="tagline">The best food in town</p>
    
         <center> <h2 class="label">Menu</h2></center>
          <p class="power">Spaghetti Carbonara</p>
          <p class="power">Grilled Chicken Salad</p>
          <p class="power">Margherita Pizza</p>
    
          <h2 class="label">Desserts</h2>
          <p class="power">Chocolate Lava Cake</p>
          <p class="power">Vanilla Ice Cream Sundae</p>
          </body>
          </html>
