<html>
    <head>
        <title>My food card</title>
        <style>
            body {
                font-style: arial;
                background-color: white;
                padding: 30px;
                text-align: center;
            }

            h1 {color: Orange;}

            h1 + p {
                background: yellow;
                padding: 10px 20px;
                border-radius: 8px;
                color: black;
                display: inline-block;
            }

            ul {padding: 0; margin-top: 20px; }

            ul > li {
                list-style: none;
                font-size: 18px;
                font-weight: bold;
                color: black;
                padding: 10px 20px;
                margin: 6px auto;
                width: 260px;
                background: white;
                border-radius: 8px;
            }

            ul li:nth-child(3) {
                background: orange;
                color: white;
            }

            .desc {
                color: #555;
                margin-top:  20px;
                font-size: 15px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto; 
            }

            .desc::first-letter {
                font-size: 220%;
                color: yellow;
                font-weight: bold;
            }

            .links  {margin-top: 25px;}
            
            a {
                color: black;
                text-decoration: none;
                font-size: 15px;
                margin: 0 12px;
                padding: 8px 18px;
                border: 2px solid yellow;
                border-radius: 8px;
            }

            a:hover {
                background: yellow;
                color: Black;
            }
            </style>
    </head>
    <body>
        <h1>My food menu</h1>
        <p>Pick your favourite dish and dig in!</p>

        <ul>
            <li>Pizza</li>
            <li>Burger</li>
            <li>Tacos - Chef's Special!</li>
            <li>Noodles</li>
            <li>Ice cream</li>
        </ul>

        <p class="desc">Every dish on the menu is mad ewith loads of love and flavour. Try all of them to find out your favourtie</p>
        <div class="links">
            <a href="#">Order Now</a>
            <a href="#">See More</a>
            </div>
    </body>
    </html>
