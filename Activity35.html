<html>
    <head>
        <title>My zoo</title>
        <style>
            body {
                background-color: lightblue;
                font-family: Arial, sans-serif;
                color: #333;
                
            }
            h1 {
                color: darkgreen;
            }
            #zoo {
               border: 2px solid darkgreen;
                padding: 20px;
                margin: 20px;
                background-color: #f0f0f0;
                border-radius: 10px;
            }
            .zone {
                margin-bottom: 20px;
                border:#333 1px solid; 
                margin: 10px;
                padding: 10px;
                text-align: left;
            }
            button {
                background-color: darkgreen;
                color: white;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to my Zoo!</h1>
        <div class="zone" id="Zone-1">Zone 1</div>
        <div class="zone" id="Zone-2">Zone 2</div>
        <div class="zone" id="Zone-3">Zone 3</div>
        <div class="zone">Total Animals <span id="total-animals"></span></div>
        <br>
        <button onclick="OpenZoo()">Open the Zoo!</button>
        <p id="zoo status"></p>
        <script>
            function OpenZoo() {
                document.getElementById("Zone-1").innerHTML = "Lion";
                document.getElementById("Zone-2").innerHTML = "Tiger";
                document.getElementById("Zone-3").innerHTML = "Bear";
                document.getElementById("total-animals").innerHTML = "3";
                document.getElementById("zoo").style.backgroundColor = "lightgreen";
                document.getElementById("zoo status").innerHTML = document.title + " is now open!";
            }
        </script>
    </body>
</html>
