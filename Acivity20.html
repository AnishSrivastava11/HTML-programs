<!DOCTYPE html>
<html>
<head>
  <title>My Ice Cream Shop Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff4f8;
      text-align: center;
      color: chocolate;
    }
    h1 {
      color: lightblue;
      font-size: 36px;
    }
    h1 + p {
      color: lightgreen;
      font-weight: bold;
      background-color: white;
      border-radius: 10px;
    }
    .shop-description::first-letter {
      font-size: 36px;
      color: white;
      font-weight: bold;
    }
    .menu-box {
      width: 420px;
      background-color: white;
      border: 3px solid #ff69b4;
      border-radius: 12px;
      margin: 15px auto;
      padding: 15px;
    }
    ul {
      padding: 0;
    }
    ul > li {
      list-style: none;
      background-color: lightblue;
      color: #5c2a4a;
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid pink;
    }
    ul > li:nth-child(3) {
      background-color: white;
      color: #b85c00;
      border: 3px solid goldenrod;
    }
    ul > li:hover {
      background-color: pink;
      color: white;
      cursor: pointer;
      transform: scale(1.05);
    }
    button {
      background-color: lightblue;
      color: lightpink;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: blue;
    }
  </style>
</head>
<body>
  <h1>My Ice Cream Shop Menu</h1>
  <p>Welcome to Scoops of Joy!</p>
  <p class="shop-description">
    We serve colourful, creamy, and delicious ice cream flavours.
  </p>
  <div class="menu-box">
    <h2>Today's Ice Cream Flavours</h2>
    <ul>
      <li>Chocolate Treat</li>
      <li>Strawberry Magic</li>
      <li>Mango Breeze - Today's Special</li>
      <li>Vanilla Swirl</li>
      <li>Blueberry Dlight</li>
    </ul>
    <button>Order Now</button>
  </div>
</body>
</html>
