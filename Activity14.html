<html>
    <head>
        <title> My fitness card</title>
        <style>
               body {
                background-color: orange;
                font-family: arial, sans-serif;
                text-align: center;
                padding: 30px;
            }
            .fact-file {
                background-color: lightgreen;
                color: white;
                padding: 20px;
                margin: 25px;
                width: 260px;
            }
            .fun-fact {
                font-size: 20px;
                color: darkgreen;
                font-weight: bold;
            }
            .tagline {
                font-size: 30px;
                color: darkgreen;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1> My fitness card</h1>
        <p class="tagline"> My daily routine</p>
        <div class="fact-file">
            <center><p> I wake up at 6am</p></center>
            <center><p> I go for a run</p></center>
            <center><p> I do pushups and situps</p></center>
            <center><p> I eat a healthy breakfast</p></center>
        </div>
        <p class="fun-fact"> Fun fact about me</p>
        <div class="fact-file">
           <center><p> I can do 100 pushups in a row</p></center>
            <center><p> I can run 5km in under 20 minutes</p></center>
            <center><p> I can hold my breath for 2 minutes</p></center>
        </div>
    </body>
    </html>
